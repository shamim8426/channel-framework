# channel config (validated by `python -m core validate`). Secrets never go here.
# AI Pandit: vertical Hinglish shorts with practical Claude / Claude Code / MCP tips.
slug: ai-pandit
name: AI Pandit
handle: '@aipandit'              # informational; set to the real handle once the channel exists
youtube_channel_id: REPLACE_ME   # UC... (24 chars). Live uploads stay blocked until this is filled in.
language: hi-Latn                # Hinglish: Hindi written in Roman script, with English technical terms
niche: 60-second Hinglish shorts teaching practical Claude / Claude Code / MCP technical tips
content_type: real_sourced       # technical claims need sources (official docs, changelogs), so research + source check are mandatory
pipeline: character_story

formats:
  # The channel is shorts-first: the "long" format is a single vertical short of up to 60 s.
  long:   {min_seconds: 30, max_seconds: 60, script_words: [80, 160], max_images: 8}
  shorts: {enabled: false}

narrators:
  - {id: narrator, role: narrator, voice_id: narrator-hinglish, language: hi-Latn,
     style: "fast, friendly Hinglish tech explainer; energetic but clear, like a senior dev bhaiya explaining to a friend"}

characters:
  - id: jugnu
    name: Jugnu
    role: mascot
    description: "an original small pixel-art robot with a square teal body, one round glowing yellow eye, a tiny antenna with a spark on top, short stubby legs, 16-bit chunky pixels with a soft drop shadow"

visual_style:
  prompt: >-
    clean minimal vertical frame, plain off-white background, one centred subject with lots of empty space,
    crisp 16-bit pixel-art, soft drop shadow, small flat line icons (terminal, file, plug, gear) floating near the subject,
    calm modern tech look
  negative_prompt: text, watermark, logo, brand logos, real product screenshots, busy background, photorealistic people
  aspect: "9:16"
  palette: ["#F7F5F0", "#1F2933", "#14B8A6", "#FACC15", "#E76F51"]

music: {library_dir: music, tracks: []}
audio: {target_lufs: -14.0, true_peak: -1.5, tempo: 1.08, music_below_voice_db: 22.0}

providers:
  llm:   {name: mock}
  image: {name: mock}
  tts:   {name: mock}
  music: {name: mock}

research: {min_sources_per_fact: 2}

safety:
  forbidden_depictions:
    - fake or edited screenshots of real products
    - logos or mascots of real companies
  forbidden_terms:
    - guaranteed income
    - 100% free forever

budget: {currency: INR, target_per_project: 30, hard_cap_per_project: 50}

youtube:
  category_id: "28"              # Science & Technology
  made_for_kids: false
  contains_synthetic_media: true
  privacy: private
  auto_publish: false
  title_suffix: "| AI Pandit #shorts"
  default_tags: [claude, claude code, mcp, ai tools, hinglish, ai in hindi, coding, shorts]
  playlists: {}
  schedule: {timezone: Asia/Kolkata, long_time: "19:00", immediate_after: "19:00", short_after_long_min: 60, one_long_per_day: true}

analytics: {provider: mock, reports: ["48h", "7d"]}
strings:
  ai_disclosure: "Visuals aur voice AI se banaye gaye hain. Facts official docs se verify kiye gaye hain."
  not_affiliated: "Yeh channel Anthropic se affiliated nahi hai."
options: {}
credentials_ref: ai-pandit
